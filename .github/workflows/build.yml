name: Build VCamdroid OBS Plugin

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libobs-dev \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libswresample-dev \
            libturbojpeg0-dev \
            libusbmuxd-dev \
            libimobiledevice-dev

      - name: Build plugin
        run: |
          mkdir -p build
          make

      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: vcamdroid-obs-linux
          path: build/vcamdroid-obs.so

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Run Windows Build Script
        shell: pwsh
        run: |
          .\win\build.ps1

      - name: Upload Windows DLL
        uses: actions/upload-artifact@v4
        with:
          name: vcamdroid-obs-windows
          path: |
            build/vcamdroid-obs.dll
            build/droidcam-obs.dll

      - name: Release Windows DLL
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: VCamdroid OBS Plugin (Latest Build)
          files: |
            build/vcamdroid-obs.dll
            build/droidcam-obs.dll
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
